name: run_tests.yml

on:
  push:
    branches:
    - main
    - dev
  pull_request:
    branches:
    - main
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: 'macos-latest'
            python-version: "3.13"
            continue-on-error: true
    runs-on: ${{ matrix.os }}
    steps:

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Setup python environment and test
      run: |
        python -V
        python -m venv .venv
        source .venv/bin/activate
        pip install --upgrade pip
        pip install -e . --group test

    - name: Run tests
      run: |
        source .venv/bin/activate
        pytest -v -ra
