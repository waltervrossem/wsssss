[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wsssss = ["_bin/gyre_driver/*.in"]

[project]
name = "wsssss"
version = "0.7.8"
authors = [
  { name="Walter van Rossem", email="walter_v_rossem@hotmail.com" },
]
description = "Walter's set of scripts for studying simulated stars."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy",
    "f90nml",
    "dill",
    "matplotlib",
    "setproctitle",
    "joblib"
]

[dependency-groups]
dev = [
    "pytest-env",
    "pre-commit",
    "black",
]

test = [
    "pytest-env",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]

license = "MIT"
license-files = ["LICENSE"]

[tool.pytest_env]

MESA_DIR = {value = "{PWD}/tests/data/dummy_software/MESA-24.08.1", transform = true, skip_if_set = true}
MESASDK_ROOT = {value = "dummy_MESASDK_ROOT", transform = true, skip_if_set = true}
GYRE_DIR = {value = "{PWD}/tests/data/dummy_software/gyre-9.1.1", transform = true, skip_if_set = true}
PATH = {value = "{MESASDK_ROOT}/bin:{PATH}", transform = true}
PGPLOT_DIR = {value = "{MESASDK_ROOT}/lib/pgplot", transform = true}
VALGRIND_LIB = {value = "{MESASDK_ROOT}/lib/valgrind", transform = true}
MESASDK_VERSION = {value = "dummyx86_64-linux-24.7.1", transform = true}

[tool.black]
line-length = 120

[project.scripts]
gyre-driver = "wsssss._bin.gyre_driver:gyre_driver.run"
mesa-go = "wsssss._bin:mesa_go.run"
check-grid = "wsssss._bin:check_grid.run"

[project.urls]
Homepage = "https://github.com/waltervrossem/wsssss"
Issues = "https://github.com/waltervrossem/wsssss/issues"
Source = "https://github.com/waltervrossem/wsssss"
Documentation = "https://wsssss.readthedocs.io"
